services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    working_dir: /app

    ports:
      - "5173:5173"

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    command: npm run dev -- --host 0.0.0.0

    networks:
      default:
        aliases:
          - shipyard.test

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e

    working_dir: /app

    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules

    environment:
      - PLAYWRIGHT_BASE_URL=${PLAYWRIGHT_BASE_URL:-http://shipyard.test:5173}

    depends_on:
      - app

    ipc: host

    command: npm run test:e2e

volumes:
  node_modules:
  e2e_node_modules: